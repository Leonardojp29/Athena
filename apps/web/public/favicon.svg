<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon de Athena. A 16px los trazos de 1,6px caen por debajo de un píxel y
    desaparecen, así que esta versión es una silueta sólida con los ojos y el pico
    calados con fill-rule evenodd. Sin un solo stroke.
  -->
  <style>
    :root { --fondo: #0A0A0C; --marca: #C6F24E; }
    @media (prefers-color-scheme: light) { :root { --fondo: #FFFFFF; --marca: #3B5F0F; } }
  </style>
  <rect width="32" height="32" rx="7" fill="var(--fondo)" />
  <path
    fill="var(--marca)"
    fill-rule="evenodd"
    d="M5.5 9.6 A4.1 4.1 0 0 1 9.6 5.5 H13.4 L16 8.9 L18.6 5.5 H22.4 A4.1 4.1 0 0 1 26.5 9.6 V15.3 C26.5 21.2 21.6 25.4 16 27.6 C10.4 25.4 5.5 21.2 5.5 15.3 Z
       M11.2 10.4 A3.5 3.5 0 1 0 11.2 17.4 A3.5 3.5 0 1 0 11.2 10.4 Z
       M20.8 10.4 A3.5 3.5 0 1 0 20.8 17.4 A3.5 3.5 0 1 0 20.8 10.4 Z
       M14.2 19.1 L17.8 19.1 L16 24.2 Z"
  />
</svg>
