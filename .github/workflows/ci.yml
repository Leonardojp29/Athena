name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # sin esto, un runner que no se asigna deja el job colgado ~15 min antes de fallar
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # mismo comando que se corre en local: pnpm verify
      - name: Verify (lint, typecheck, test, build)
        run: pnpm verify
