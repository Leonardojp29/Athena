# Athena local development infrastructure.
# Postgres/Auth live in Supabase (managed); nothing is required locally.
# Optional local Postgres is provided for offline work — enable with:
#   docker compose --profile local-db up
services:
  postgres:
    profiles: ['local-db']
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
      POSTGRES_DB: athena
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
